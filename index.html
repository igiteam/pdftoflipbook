<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flibook Magazines - Shelf Archive</title>
    <link rel="icon" href="https://raw.githubusercontent.com/igiteam/pdftoflipbook/refs/heads/main/pdf_flipbook.png" type="image/png">
    <style>
        /* 1. Define our global zoom variable */
        :root {
            --zoom: 1;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #1a0f08;
            overflow: hidden;
        }

        /* Fixed top banner — only visible when a search has 0 results */
        .top-no-results {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 110;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 8px 16px;
            background: rgba(16, 9, 5, 0.94);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(212, 175, 90, 0.4);
            color: #d4af5a;
            font-family: monospace;
            font-size: 13px;
            text-align: center;
        }

        .top-no-results.visible {
            display: flex;
        }

        .shelf-container {
            flex: 1;
            overflow: auto;
            background-color: #1a0f08;
        }

        /* 2. Scale the background AND layout spacing together */
        #bigshelf {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-end;
            min-height: 100%;
            position: relative;
            background-image: url('https://raw.githubusercontent.com/igiteam/pdftoflipbook/refs/heads/main/bg_normal_shelf.png');
            background-repeat: repeat;
            background-position: top left;
            background-size: calc(2048px * var(--zoom)) auto;
            gap: calc(15px * var(--zoom));
            padding: calc(24px * var(--zoom)) 0 calc(96px * var(--zoom)) 0;
        }

        .shelf-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: calc(15px * var(--zoom));
            width: 100%;
            position: relative;
            background-size: cover;
            background-position: center;
            background-repeat: repeat;
        }

        /* Draw shelf into the gap between rows - NOW APPLIES TO ALL ROWS including last */
        .shelf-row::after {
            content: "";
            position: absolute;
            bottom: calc(-15px * var(--zoom));
            left: 0;
            width: 100%;
            height: calc(15px * var(--zoom));
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            z-index: 1;
            pointer-events: none;
        }

        .shelf-row:last-child {
            margin-bottom: 0;
        }

        .shelf-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            background: transparent;
            z-index: 10;
            margin-top: calc(20px * var(--zoom));
        }

        .shelf-item.hidden {
            display: none !important;
        }

        .shelf-item:hover {
            transform: translateY(-8px);
        }

        .shelf-item:hover .shelf-cover {
            transform: perspective(1000px) rotateX(3deg) rotateY(3deg) scale(1.02);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 12px 12px rgba(0, 0, 0, 0.3);
        }

        .shelf-cover {
            height: calc(280px * var(--zoom));
            width: auto;
            border-radius: 4px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 1;
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 3%, black 97%, transparent 100%),
                linear-gradient(to bottom, transparent 0%, black 3%, black 97%, transparent 100%);
            -webkit-mask-composite: intersect;
            mask-image: linear-gradient(to right, transparent 0%, black 3%, black 97%, transparent 100%),
                linear-gradient(to bottom, transparent 0%, black 3%, black 97%, transparent 100%);
            mask-composite: intersect;
            background: #2a1a10 url('https://raw.githubusercontent.com/igiteam/pdftoflipbook/refs/heads/main/123x180.png') center / contain no-repeat;
            min-width: calc(123px * var(--zoom) / 1.55);
        }

        .mag-name {
            font-size: clamp(9px, calc(11px * var(--zoom)), 14px);
            margin-top: max(4px, calc(6px * var(--zoom)));
            padding: max(3px, calc(4px * var(--zoom))) max(6px, calc(8px * var(--zoom)));
            max-width: clamp(120px, calc(180px * var(--zoom)), 240px);
            color: #d4af5a;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
            backdrop-filter: blur(4px);
            transition: all 0.2s;
            text-align: center;
            white-space: normal;
            word-break: keep-all;
            line-height: 1.3;
            position: relative;
            z-index: 1;
            display: none;
        }

        .shelf-item:hover .mag-name {
            transform: translateY(-2px);
            color: #f0c674;
        }

        /* ---- Delicious Library Style Bottom Bar ---- */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 46px;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(38, 24, 14, 0.94), rgba(16, 9, 5, 0.97));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(212, 175, 90, 0.35);
            box-shadow: 0 -4px 18px rgba(0, 0, 0, 0.65);
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 14px;
            gap: 10px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .bar-left {
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .add-btn {
            width: 30px;
            height: 28px;
            border-radius: 7px;
            border: 1px solid rgba(212, 175, 90, 0.55);
            background: linear-gradient(to bottom, #3b2616, #24160c);
            color: #f0c674;
            font-size: 18px;
            font-weight: 600;
            line-height: 1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 1px 2px rgba(0, 0, 0, 0.5);
            transition: all 0.15s ease;
        }

        .add-btn:hover {
            background: linear-gradient(to bottom, #4b311d, #2e1c0f);
            border-color: #f0c674;
            color: #fff;
        }

        .add-btn:active {
            transform: scale(0.95);
        }

        .bar-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
            width: clamp(190px, 34vw, 380px);
        }

        .search-icon {
            position: absolute;
            left: 10px;
            width: 13px;
            height: 13px;
            color: #b59652;
            pointer-events: none;
        }

        #searchInput {
            width: 100%;
            height: 28px;
            padding: 0 58px 0 28px;
            border-radius: 14px;
            border: 1px solid rgba(212, 175, 90, 0.45);
            background: rgba(10, 6, 4, 0.85);
            color: #f5e6c4;
            font-size: 12.5px;
            outline: none;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.7);
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        #searchInput::placeholder {
            color: rgba(212, 175, 90, 0.5);
        }

        #searchInput:focus {
            border-color: #f0c674;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(212, 175, 90, 0.2);
        }

        .search-count {
            position: absolute;
            right: 24px;
            font-size: 10.5px;
            color: rgba(212, 175, 90, 0.7);
            font-family: ui-monospace, monospace;
            pointer-events: none;
        }

        .search-clear {
            position: absolute;
            right: 6px;
            width: 16px;
            height: 16px;
            border: none;
            border-radius: 50%;
            background: rgba(212, 175, 90, 0.25);
            color: #f0c674;
            font-size: 11px;
            line-height: 1;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .search-clear.visible {
            display: inline-flex;
        }

        .search-clear:hover {
            background: rgba(212, 175, 90, 0.45);
        }

        .bar-right {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 8px;
        }

        .zoom-icon {
            color: #b59652;
            font-size: 11px;
            user-select: none;
        }

        #zoomSlider {
            width: 110px;
            height: 4px;
            cursor: pointer;
            accent-color: #d4af5a;
        }

        .zoom-value {
            color: #d4af5a;
            font-weight: 600;
            font-size: 11.5px;
            font-family: ui-monospace, monospace;
            min-width: 38px;
            text-align: right;
        }

        @media (max-width: 560px) {
            .bottom-bar { padding: 0 8px; gap: 6px; }
            #zoomSlider { width: 70px; }
            .zoom-value { display: none; }
        }

        .loading {
            color: #d4af5a;
            font-size: 20px;
            text-align: center;
            padding: 100px 20px;
            font-family: monospace;
            width: 100%;
        }

        .shelf-container::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        .shelf-container::-webkit-scrollbar-track {
            background: #0a0604;
        }

        .shelf-container::-webkit-scrollbar-thumb {
            background: #d4af5a;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div id="topNoResults" class="top-no-results">No magazines match your search.</div>

    <div class="shelf-container">
        <div id="bigshelf">
            <div class="loading">📚 LOADING MAGAZINES FROM ARCHIVE...</div>
        </div>
    </div>

    <!-- Delicious Library Style Bottom Bar -->
    <div class="bottom-bar">
        <div class="bar-left">
            <button id="addBtn" class="add-btn" title="Add Magazine">+</button>
        </div>

        <div class="bar-center">
            <div class="search-box">
                <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
                    <circle cx="7" cy="7" r="4.8"></circle>
                    <path d="M10.8 10.8L14 14" stroke-linecap="round"></path>
                </svg>
                <input type="text" id="searchInput" placeholder="Search magazines…" autocomplete="off" spellcheck="false">
                <span id="searchCount" class="search-count"></span>
                <button id="searchClear" class="search-clear" title="Clear search (Esc)">×</button>
            </div>
        </div>

        <div class="bar-right">
            <span class="zoom-icon" title="Smaller covers">▫</span>
            <input type="range" id="zoomSlider" min="30" max="200" value="80" step="5" title="Cover Zoom">
            <span class="zoom-icon" title="Larger covers">◻</span>
            <span class="zoom-value" id="zoomPercent">80%</span>
        </div>
    </div>

    <script>
        let magazines = [];
        let currentZoom = 80;
        let itemsPerRow = 5;
        let currentQuery = '';

        const jsonUrl = 'https://raw.githubusercontent.com/igiteam/pdftoflipbook/refs/heads/main/magazines.json';
        const PLACEHOLDER_IMG = 'https://raw.githubusercontent.com/igiteam/pdftoflipbook/refs/heads/main/123x180.png';

        const shelfBgImages = [
            'https://raw.githubusercontent.com/igiteam/pdftoflipbook/refs/heads/main/bookshelfbg1.png',
            'https://raw.githubusercontent.com/igiteam/pdftoflipbook/refs/heads/main/bookshelfbg2.png',
            'https://raw.githubusercontent.com/igiteam/pdftoflipbook/refs/heads/main/bookshelfbg3.png'
        ];

        const shelfImages = [
            'https://raw.githubusercontent.com/igiteam/pdftoflipbook/refs/heads/main/bookshelf1.png',
            'https://raw.githubusercontent.com/igiteam/pdftoflipbook/refs/heads/main/bookshelf2.png',
            'https://raw.githubusercontent.com/igiteam/pdftoflipbook/refs/heads/main/bookshelf3.png'
        ];

        function loadSavedZoom() {
            const saved = localStorage.getItem('pczone-mag-zoom');
            if (saved && !isNaN(saved)) {
                currentZoom = Math.min(200, Math.max(30, parseInt(saved, 10)));
                document.getElementById('zoomSlider').value = currentZoom;
                document.getElementById('zoomPercent').textContent = currentZoom + '%';
            }
        }

        function saveZoom(zoom) {
            localStorage.setItem('pczone-mag-zoom', zoom);
        }

        function applyZoom() {
            const zoomFactor = currentZoom / 100;
            document.documentElement.style.setProperty('--zoom', zoomFactor);
            document.getElementById('zoomPercent').textContent = currentZoom + '%';
            saveZoom(currentZoom);
            organizeIntoRows();
        }

        function preloadAllImages(items) {
            items.forEach(mag => {
                if (mag.imageUrl && mag.imageUrl !== '#') {
                    const img = new Image();
                    img.src = mag.imageUrl;
                }
            });
            [...shelfBgImages, ...shelfImages, PLACEHOLDER_IMG].forEach(url => {
                const img = new Image();
                img.src = url;
            });
        }

        // Fast instant search over pre-indexed searchText (multi-word AND match)
        function filterMagazines(query) {
            currentQuery = (query || '').trim().toLowerCase();
            const terms = currentQuery ? currentQuery.split(/\s+/) : [];
            const clearBtn = document.getElementById('searchClear');
            const countEl = document.getElementById('searchCount');
            const topNoResultsEl = document.getElementById('topNoResults');

            clearBtn.classList.toggle('visible', currentQuery.length > 0);

            let visibleCount = 0;
            for (let i = 0; i < magazines.length; i++) {
                const mag = magazines[i];
                let match = true;
                for (let t = 0; t < terms.length; t++) {
                    if (!mag.searchText.includes(terms[t])) {
                        match = false;
                        break;
                    }
                }
                mag.el.classList.toggle('hidden', !match);
                if (match) visibleCount++;
            }

            countEl.textContent = currentQuery ? `${visibleCount}/${magazines.length}` : `${magazines.length}`;
            topNoResultsEl.classList.toggle('visible', magazines.length > 0 && visibleCount === 0);

            organizeIntoRows();
        }

        function organizeIntoRows() {
            const shelf = document.getElementById('bigshelf');
            if (!shelf || magazines.length === 0) return;

            const containerWidth = shelf.clientWidth;
            const coverWidth = 280 * (currentZoom / 100);
            const gapSize = 15 * (currentZoom / 100);
            const horizontalPadding = 60;
            const itemTotalWidth = coverWidth + gapSize;

            itemsPerRow = Math.max(1, Math.floor((containerWidth - horizontalPadding) / itemTotalWidth));

            const visibleItems = magazines
                .filter(m => !m.el.classList.contains('hidden'))
                .map(m => m.el);

            const existingRows = shelf.querySelectorAll('.shelf-row');
            existingRows.forEach(row => row.remove());

            if (visibleItems.length === 0) return;

            const rowCount = Math.ceil(visibleItems.length / itemsPerRow);
            let rowStyles = '';

            for (let r = 0; r < rowCount; r++) {
                const rowItems = visibleItems.slice(r * itemsPerRow, (r + 1) * itemsPerRow);
                const rowDiv = document.createElement('div');
                rowDiv.className = 'shelf-row';
                rowDiv.dataset.row = r;

                const randomBgImage = shelfBgImages[r % shelfBgImages.length];
                rowDiv.style.backgroundImage = `url('${randomBgImage}')`;

                for (let j = 0; j < rowItems.length; j++) {
                    rowDiv.appendChild(rowItems[j]);
                }
                shelf.appendChild(rowDiv);

                const randomShelfImage = shelfImages[r % shelfImages.length];
                rowStyles += `.shelf-row[data-row="${r}"]::after { background-image: url('${randomShelfImage}'); }\n`;
            }

            let styleTag = document.getElementById('dynamic-shelf-styles');
            if (!styleTag) {
                styleTag = document.createElement('style');
                styleTag.id = 'dynamic-shelf-styles';
                document.head.appendChild(styleTag);
            }
            styleTag.textContent = rowStyles;
        }

        function formatDisplayTitle(mag) {
            let raw = mag.display_title || mag.original_name || mag.title || 'PC Zone Magazine';
            raw = raw.replace(/\.pdf$/i, '').replace(/_/g, ' ');
            if (raw.includes('  ')) raw = raw.replace(/\s+/g, ' ');
            return raw.trim();
        }

        async function loadMagazinesFromJson() {
            const shelfDiv = document.getElementById('bigshelf');
            shelfDiv.innerHTML = '<div class="loading">📚 LOADING MAGAZINES FROM ARCHIVE...</div>';

            try {
                const response = await fetch(jsonUrl);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();

                if (!data || !data.success || !Array.isArray(data.history)) {
                    throw new Error('Invalid JSON structure: missing history array or success flag');
                }

                const uniqueMagMap = new Map();
                for (const item of data.history) {
                    if (item && item.id && !uniqueMagMap.has(item.id)) {
                        uniqueMagMap.set(item.id, item);
                    }
                }

                const uniqueMagazines = Array.from(uniqueMagMap.values());

                magazines = uniqueMagazines.map(mag => {
                    const displayTitle = formatDisplayTitle(mag);
                    const originalTitle = mag.title || '';
                    const thumbnailUrl = mag.cover_url || PLACEHOLDER_IMG;
                    const pdfUrl = mag.html_url || '#';
                    const searchText = `${displayTitle} ${originalTitle} ${mag.original_name || ''} ${mag.id || ''}`.toLowerCase();

                    return {
                        id: mag.id,
                        title: displayTitle,
                        originalTitle: originalTitle,
                        imageUrl: thumbnailUrl,
                        pdfUrl: pdfUrl,
                        rawData: mag,
                        searchText: searchText,
                        el: null
                    };
                });

                magazines.sort((a, b) => {
                    const getIssueNumber = (mag) => {
                        const text = mag.searchText;
                        const issueMatch = text.match(/issue[\s_-]*(\d+)/i);
                        if (issueMatch) return parseInt(issueMatch[1], 10);
                        const standaloneMatch = text.match(/\b(\d{2,3})\b/);
                        if (standaloneMatch && !text.includes('page') && !text.includes('count')) {
                            const num = parseInt(standaloneMatch[1], 10);
                            if (num > 0 && num < 300) return num;
                        }
                        return 9999;
                    };
                    const numA = getIssueNumber(a);
                    const numB = getIssueNumber(b);
                    if (numA !== numB) return numA - numB;
                    return a.title.localeCompare(b.title);
                });

                preloadAllImages(magazines);
                shelfDiv.innerHTML = '';

                magazines.forEach((mag, index) => {
                    const coverUrl = mag.imageUrl && mag.imageUrl !== '#' ? mag.imageUrl : PLACEHOLDER_IMG;
                    const pdfUrl = mag.pdfUrl;
                    const displayTitle = mag.title || `Magazine ${index + 1}`;

                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'shelf-item';

                    const img = document.createElement('img');
                    img.className = 'shelf-cover';
                    img.loading = 'lazy';
                    img.src = PLACEHOLDER_IMG;
                    img.dataset.realSrc = coverUrl;
                    img.alt = displayTitle;
                    img.title = displayTitle;

                    img.onload = () => {
                        if (img.dataset.realSrc && img.src !== img.dataset.realSrc) {
                            img.src = img.dataset.realSrc;
                        }
                    };
                    img.onerror = () => {
                        if (img.src !== PLACEHOLDER_IMG) {
                            img.src = PLACEHOLDER_IMG;
                        }
                    };

                    itemDiv.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (pdfUrl && pdfUrl !== '#') {
                            window.open(pdfUrl, '_blank');
                        }
                    });

                    const nameSpan = document.createElement('div');
                    nameSpan.className = 'mag-name';
                    nameSpan.textContent = displayTitle;

                    itemDiv.appendChild(img);
                    itemDiv.appendChild(nameSpan);
                    shelfDiv.appendChild(itemDiv);

                    mag.el = itemDiv;
                });

                document.getElementById('searchCount').textContent = `${magazines.length}`;
                loadSavedZoom();
                applyZoom();

            } catch (error) {
                console.error('Failed to load magazine JSON:', error);
                shelfDiv.innerHTML = `<div class="loading" style="color: red;">❌ ERROR: Failed to load magazine data.<br>${error.message}</div>`;
            }
        }

        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (magazines.length > 0) organizeIntoRows();
            }, 120);
        });

        function bindControls() {
            const zoomSlider = document.getElementById('zoomSlider');
            zoomSlider.addEventListener('input', (e) => {
                currentZoom = parseInt(e.target.value, 10);
                applyZoom();
            });

            const searchInput = document.getElementById('searchInput');
            const searchClear = document.getElementById('searchClear');

            searchInput.addEventListener('input', (e) => {
                filterMagazines(e.target.value);
            });

            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    searchInput.value = '';
                    filterMagazines('');
                    searchInput.blur();
                }
            });

            searchClear.addEventListener('click', () => {
                searchInput.value = '';
                filterMagazines('');
                searchInput.focus();
            });

            window.addEventListener('keydown', (e) => {
                if ((e.key === '/' && document.activeElement !== searchInput) ||
                    ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f')) {
                    e.preventDefault();
                    searchInput.focus();
                    searchInput.select();
                }
            });

            document.getElementById('addBtn').addEventListener('click', () => {
                window.open('https://github.com/igiteam/pdftoflipbook', '_blank');
            });
        }

        async function init() {
            bindControls();
            await loadMagazinesFromJson();
        }

        init();
    </script>
</body>
</html>
